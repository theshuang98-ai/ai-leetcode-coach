# ── Production Docker Compose for AI LeetCode Coach ──────────────────
#
# Services:
#   - postgres (PostgreSQL 16)
#   - redis (Redis 7)
#   - app (Next.js production build)
#   - scheduler (Python daily push engine)
#   - nginx (reverse proxy, SSL termination)
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Prerequisites:
#   - .env file with all required environment variables (DATABASE_URL, etc.)
#   - SSL certificates at ./nginx/ssl/ (or use Let's Encrypt)
#   - Docker and Docker Compose v2 installed
#
# Environment file (.env) must be present in the same directory.

version: '3.8'

services:
  # ── PostgreSQL (Production) ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aitoearn-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aitoearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aitoearn}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-aitoearn}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aitoearn_net
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ── Redis (Production) ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aitoearn-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aitoearn_net
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ── Next.js App (Production) ────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    image: aitoearn-app:latest
    container_name: aitoearn-app
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      # Database
      - DATABASE_URL=${DATABASE_URL}
      # Redis (optional for the Next.js app)
      - REDIS_URL=${REDIS_URL}
      # NextAuth
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      # WeChat OAuth
      - WECHAT_APP_ID=${WECHAT_APP_ID}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET}
      # Stripe
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID}
      - NEXT_PUBLIC_STRIPE_KEY=${NEXT_PUBLIC_STRIPE_KEY}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      # Monitoring
      - SENTRY_DSN=${SENTRY_DSN:-}
      # Node
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aitoearn_net
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ── Scheduler (Python Daily Push Engine) ────────────────────────
  scheduler:
    build:
      context: ./services/scheduler
    image: aitoearn-scheduler:latest
    container_name: aitoearn-scheduler
    restart: unless-stopped
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aitoearn_net
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ── Nginx Reverse Proxy ─────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: aitoearn-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/www:/var/www/html:ro
    depends_on:
      - app
    networks:
      - aitoearn_net
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  aitoearn_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
