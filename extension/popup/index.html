<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 360px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    .status { font-size: 13px; padding: 8px; border-radius: 6px; margin-bottom: 12px; }
    .connected { background: #dcfce7; color: #166534; }
    .disconnected { background: #fef2f2; color: #991b1b; }
    input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; margin-bottom: 8px; }
    button { width: 100%; padding: 8px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; margin-bottom: 6px; }
    .save-btn { background: #2563eb; color: white; }
    .disconnect-btn { background: #ef4444; color: white; }
    .hint { font-size: 11px; color: #6b7280; margin-top: 6px; }

    /* ── Task Section ── */
    #tasks-section { margin-top: 16px; display: none; }
    #tasks-section.visible { display: block; }

    .tasks-divider { border: none; border-top: 1px solid #e5e7eb; margin: 0 0 12px; }

    .tasks-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .tasks-title { font-size: 14px; font-weight: 600; color: #111827; }
    .refresh-btn { width: auto; padding: 4px 8px; background: #f3f4f6; color: #374151; font-size: 14px; border-radius: 4px; line-height: 1; }
    .refresh-btn:hover { background: #e5e7eb; }

    .streak-badge { font-size: 12px; color: #f59e0b; margin-bottom: 8px; display: none; }

    .progress-bar { height: 6px; background: #e5e7eb; border-radius: 3px; margin-bottom: 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: #2563eb; border-radius: 3px; transition: width 0.3s ease; }

    .task-list { margin-bottom: 8px; }
    .task-row { display: flex; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; margin-bottom: 2px; transition: background 0.15s; }
    .task-row:hover { background: #f3f4f6; }
    .task-icon { font-size: 14px; margin-right: 8px; flex-shrink: 0; }
    .task-title { font-size: 13px; color: #374151; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-row--solved .task-title { color: #9ca3af; text-decoration: line-through; }

    .next-btn { background: #059669; color: white; }
    .next-btn:hover { background: #047857; }
    .next-btn:disabled { background: #9ca3af; cursor: not-allowed; }

    .celebration { text-align: center; padding: 16px 8px; display: none; }
    .celebration.visible { display: block; }
    .celebration-icon { font-size: 32px; margin-bottom: 6px; }
    .celebration-text { font-size: 14px; color: #059669; font-weight: 600; }

    .empty-state { text-align: center; padding: 16px 8px; color: #9ca3af; font-size: 13px; display: none; }
    .empty-state.visible { display: block; }
    .empty-icon { font-size: 24px; margin-bottom: 4px; }
    .task-error { font-size: 12px; color: #ef4444; text-align: center; padding: 8px; display: none; }
  </style>
</head>
<body>
  <h1>AI LeetCode 私教</h1>

  <!-- ── API Key Section (existing) ── -->
  <div id="status" class="status disconnected">未连接 — 请输入 API Key</div>
  <input type="text" id="apiKey" placeholder="粘贴你的 API Key (32位十六进制)">
  <button class="save-btn" id="saveBtn">保存</button>
  <button class="disconnect-btn" id="disconnectBtn" style="display:none">断开连接</button>
  <p class="hint">在网页端 <a href="http://localhost:3000/settings" target="_blank">设置页面</a> 获取你的 API Key</p>

  <!-- ── Task Section (NEW) ── -->
  <div id="tasks-section">
    <hr class="tasks-divider">

    <div class="tasks-header">
      <span class="tasks-title" id="tasks-title">今日任务</span>
      <button class="refresh-btn" id="refreshBtn" title="刷新任务">🔄</button>
    </div>

    <div class="streak-badge" id="streakBadge"></div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>

    <div class="task-list" id="taskList"></div>

    <button class="next-btn" id="nextBtn">下一题</button>

    <div class="celebration" id="celebration">
      <div class="celebration-icon">🎉</div>
      <div class="celebration-text">今日任务完成</div>
    </div>

    <div class="empty-state" id="emptyState">
      <div class="empty-icon">📭</div>
      <div>暂无今日任务</div>
    </div>

    <div class="task-error" id="taskError"></div>
  </div>

  <!-- ── Sync Section (LeetCode CN data sync) ── -->
  <div id="sync-section" style="display:none">
    <hr class="tasks-divider">
    <div class="tasks-header">
      <span class="tasks-title">同步数据</span>
    </div>
    <p style="font-size:12px;color:#6b7280;margin:0 0 8px;">
      将你在 LeetCode CN 上的 AC 记录同步到系统中
    </p>
    <button class="save-btn" id="syncBtn" style="display:none">🔄 同步 LeetCode 数据</button>
    <button class="disconnect-btn" id="syncBtnCn" style="display:none">🔄 同步 LeetCode CN 数据</button>
    <div id="syncStatus" style="font-size:12px;margin-top:6px;display:none"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
