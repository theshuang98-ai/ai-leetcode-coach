version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aitoearn-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: aitoearn
      POSTGRES_PASSWORD: aitoearn_dev
      POSTGRES_DB: aitoearn
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aitoearn']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aitoearn-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aitoearn-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://aitoearn:aitoearn_dev@postgres:5432/aitoearn
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-dev-secret-change-me}
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  scheduler:
    build:
      context: ./services/scheduler
    container_name: aitoearn-scheduler
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://aitoearn:aitoearn_dev@postgres:5432/aitoearn
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services/scheduler:/app

volumes:
  postgres_data:
  redis_data:
