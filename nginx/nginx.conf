# ── Nginx Configuration for AI LeetCode Coach ──────────────────────
#
# Production-grade reverse proxy for Next.js app.
# Manages SSL termination, static caching, gzip, security headers,
# and Let's Encrypt ACME challenges.
#
# Usage: mount this file at /etc/nginx/nginx.conf inside the container.
#
# The nginx container expects:
#   ./nginx/nginx.conf        → /etc/nginx/nginx.conf
#   ./nginx/conf.d/*.conf     → /etc/nginx/conf.d/
#   ./nginx/ssl/              → /etc/nginx/ssl/
#   ./nginx/www/              → /var/www/html/ (for Let's Encrypt)
#
# Customize by replacing ${DOMAIN} placeholders or creating
# conf.d/site.conf with server-specific overrides.

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  multi_accept on;
  use epoll;
}

http {
  # ── Basic Settings ──────────────────────────────────────────────
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;

  # ── MIME Types ──────────────────────────────────────────────────
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Logging ────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main buffer=16k;
  error_log /var/log/nginx/error.log warn;

  # ── Gzip Compression ────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/octet-stream
    image/svg+xml
    font/woff
    font/woff2;

  # ── Rate Limiting Zones ─────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  # ── Upstream: Next.js App Server ────────────────────────────────
  upstream nextjs_upstream {
    server app:3000;
    keepalive 64;
  }

  # ── HTTP → HTTPS Redirect Server ────────────────────────────────
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt ACME challenge (must be accessible on port 80)
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/html;
      default_type text/plain;
      allow all;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS Server ────────────────────────────────────────────────
  server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # ── SSL Configuration ─────────────────────────────────────────
    # Replace with your actual certificate paths or use Let's Encrypt.
    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #
    # For local dev (self-signed), see deploy/README.md.

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (uncomment after SSL is verified)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # ── Security Headers ──────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Static Asset Caching (Next.js builds) ─────────────────────
    # Next.js appends content hashes to filenames in _next/static,
    # so we can safely cache aggressively.
    location /_next/static/ {
      proxy_pass http://nextjs_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;

      # Cache static assets for 1 year (immutable due to content hash)
      add_header Cache-Control "public, max-age=31536000, immutable";
      expires 365d;
      access_log off;
    }

    # ── Public / Static Files ────────────────────────────────────
    location /public/ {
      alias /var/www/html/public/;
      add_header Cache-Control "public, max-age=86400";
      expires 1d;
      access_log off;
    }

    # ── Favicon / Robots ─────────────────────────────────────────
    location = /favicon.ico {
      proxy_pass http://nextjs_upstream;
      access_log off;
      log_not_found off;
      expires 30d;
    }

    location = /robots.txt {
      proxy_pass http://nextjs_upstream;
      access_log off;
      log_not_found off;
    }

    # ── API Routes (no caching) ───────────────────────────────────
    location /api/ {
      proxy_pass http://nextjs_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;

      # Rate limiting for API
      limit_req zone=api burst=10 nodelay;

      # Don't cache API responses
      add_header Cache-Control "no-store, no-cache, must-revalidate";
      expires off;
    }

    # ── Login Rate Limiting ──────────────────────────────────────
    location = /api/auth/callback/credentials {
      limit_req zone=login burst=3 delay=2;
      proxy_pass http://nextjs_upstream;
    }

    # ── Next.js App (All Other Routes) ────────────────────────────
    location / {
      proxy_pass http://nextjs_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;

      # Don't cache HTML
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      expires off;

      # Increase buffer for SSE/push
      proxy_buffering off;
      proxy_buffer_size 4k;
      proxy_buffers 8 4k;
    }

    # ── WebSocket Support ────────────────────────────────────────
    location /_next/webpack-hmr {
      proxy_pass http://nextjs_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 86400;
    }

    # ── Error Pages ──────────────────────────────────────────────
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
      root /var/www/html;
    }
  }
}
